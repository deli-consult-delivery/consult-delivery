<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
  // GitHub Pages SPA redirect trick
  // Redireciona /aprovacao/<token> → /?p=aprovacao/<token>
  var path = window.location.pathname.slice(1);
  var search = window.location.search;
  var hash = window.location.hash;
  var redirectUrl = window.location.origin + '/?p=' + encodeURIComponent(path) + (search ? '&' + search.slice(1) : '') + hash;
  window.location.replace(redirectUrl);
</script>
</head>
<body></body>
</html>
