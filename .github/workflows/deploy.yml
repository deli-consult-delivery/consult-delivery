name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EVOLUTION_URL: ${{ secrets.VITE_EVOLUTION_URL }}
          VITE_EVOLUTION_KEY: ${{ secrets.VITE_EVOLUTION_KEY }}
          VITE_BRIDGE_URL: ${{ secrets.VITE_BRIDGE_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: app.consultdelivery.com.br

  deploy-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Deploy Trigger.dev worker
        run: npx trigger.dev@4.4.6 deploy --native-build-server
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}

  deploy-bridge:
    runs-on: [self-hosted, bridge-vps]

    steps:
      - name: Deploy bridge-server na VPS
        run: |
          set -e
          cd /root/consult-delivery
          git fetch origin main
          git reset --hard origin/main
          pm2 restart bridge-server || pm2 start bridge-server
          echo "✅ Deploy concluído"
          pm2 list
