name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EVOLUTION_URL: ${{ secrets.VITE_EVOLUTION_URL }}
          VITE_EVOLUTION_KEY: ${{ secrets.VITE_EVOLUTION_KEY }}
          VITE_BRIDGE_URL: ${{ secrets.VITE_BRIDGE_URL }}
          VITE_ANALISTA_WEBHOOK_URL: https://bridge.consultdelivery.com.br/analise
          VITE_BRIDGE_SECRET: ${{ secrets.VITE_BRIDGE_SECRET }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: app.consultdelivery.com.br

  deploy-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Deploy Trigger.dev worker
        run: npx trigger.dev@latest deploy --native-build-server
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}

  deploy-bridge:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy bridge-server na VPS (com retry)
        run: |
          SSH="ssh -i ~/.ssh/deploy_key \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"

          SCRIPT='
            set -e
            cd /root/consult-delivery
            git fetch origin main
            git reset --hard origin/main
            pm2 restart bridge-server || pm2 start bridge-server
          '

          for attempt in 1 2 3; do
            echo "=== Tentativa $attempt/3 ==="
            if $SSH "$SCRIPT"; then
              echo "✅ Deploy concluído na tentativa $attempt"
              exit 0
            fi
            echo "❌ Tentativa $attempt falhou"
            if [ "$attempt" -lt 3 ]; then
              echo "Aguardando 20s antes de tentar novamente..."
              sleep 20
            fi
          done

          echo "💥 Todas as 3 tentativas falharam"
          echo "Verifique a VPS: ${{ secrets.VPS_HOST }}:22"
          exit 1
