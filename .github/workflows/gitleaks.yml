name: gitleaks

# Varredura de segredos (GATE 0 / Blueprint v2 §6). O VENDAERP_TOKEN já vazou uma vez;
# este job barra qualquer commit/PR que reintroduza segredo no repo.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
