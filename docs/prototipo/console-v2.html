<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consult Delivery · Console v2 — Protótipo (clean)</title>
<style>
:root{--bg:#f6f7f9;--panel:#ffffff;--line:#e7eaf0;--tx:#23272f;--tx2:#7a8499;--red:#d92329;--red-soft:#fdeeee;--green:#1f9d55;--green-soft:#e6f6ec;--amber:#b7791f;--amber-soft:#fdf3e1;--blue:#2563eb;--blue-soft:#e8effd;--dark:#1c1f26}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--tx);font-size:14px;overflow:hidden}
#app{display:flex;height:100vh}
#sb{width:236px;min-width:236px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
#sb .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px}
#sb .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:17px}
#sb .brand b{font-size:13.5px;letter-spacing:.3px;line-height:1.1;display:block}
#sb .brand small{color:var(--tx2);font-size:10px}
#sb .grp{padding:16px 16px 5px;font-size:10.5px;letter-spacing:1px;color:var(--tx2);text-transform:uppercase;font-weight:600}
#sb a{display:flex;align-items:center;gap:10px;padding:7.5px 16px;color:#3d4555;text-decoration:none;font-size:13.5px;border-left:3px solid transparent}
#sb a:hover{background:#f4f6f9}
#sb a.on{color:var(--red);background:var(--red-soft);border-left-color:var(--red);font-weight:600}
#sb a .ic{width:17px;text-align:center;opacity:.75;font-size:13px}
#sb .cred{margin-top:auto;padding:13px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--tx2)}
#sb .cred .bar{height:5px;background:#eef0f4;border-radius:3px;margin-top:6px}#sb .cred .bar i{display:block;height:5px;width:34%;background:var(--green);border-radius:3px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#tb{display:flex;align-items:center;gap:14px;padding:11px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
#tb .crumb{color:var(--tx2);font-size:13px;white-space:nowrap}#tb .crumb b{color:var(--tx)}
#tb .search{flex:1;max-width:460px;background:#f4f6f9;border:1px solid var(--line);border-radius:9px;padding:8px 13px;color:var(--tx);font-size:13px;outline:none}
#tb select{background:#fff;color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px}
#tb .pill{background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--tx2);white-space:nowrap}
#tb .pill b{color:var(--tx)}
#tb .avatar{width:32px;height:32px;border-radius:50%;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
#ct{flex:1;overflow-y:auto;padding:24px 28px}
h1{font-size:21px;font-weight:700;margin-bottom:3px}
.sub{color:var(--tx2);font-size:13px;margin-bottom:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.kpi .l{color:var(--tx2);font-size:12.5px}
.kpi .v{font-size:23px;font-weight:700;margin:5px 0 3px;letter-spacing:-.5px}
.kpi .d{font-size:12px;font-weight:600;color:var(--green)}.kpi .d.neg{color:var(--red)}.kpi .d.mut{color:var(--tx2);font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.card h3{font-size:14.5px;font-weight:700;margin-bottom:12px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8f9fb;color:var(--tx2);font-weight:600;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:9px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid #f0f2f6;color:#39404e}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfd}
.bdg{display:inline-block;padding:3px 10px;border-radius:11px;font-size:11.5px;font-weight:600}
.b-ok{background:var(--green-soft);color:var(--green)}.b-warn{background:var(--amber-soft);color:var(--amber)}.b-err{background:var(--red-soft);color:var(--red)}.b-info{background:var(--blue-soft);color:var(--blue)}.b-mut{background:#eef0f4;color:var(--tx2)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;border:none;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
.btn.dark{background:var(--dark)}
.btn.sec{background:#fff;color:#3d4555;border:1px solid #d7dce5}
.btn.danger{background:#fff;color:var(--red);border:1px solid #f3c1c3}
.btn.sm{padding:5px 11px;font-size:12px}
.btn:hover{filter:brightness(.95)}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;cursor:pointer;position:relative;transition:box-shadow .15s,border .15s}
.acard:hover{border-color:#cfd6e1;box-shadow:0 2px 10px rgba(20,30,60,.06)}
.acard .av{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;margin-bottom:10px}
.acard b{font-size:14px}.acard p{color:var(--tx2);font-size:12.5px;margin:4px 0 12px;min-height:32px}
.acard .ft{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--tx2)}
.tag{position:absolute;top:13px;right:13px;font-size:10.5px;color:var(--tx2);background:#f4f6f9;padding:2px 8px;border-radius:8px}
.tgl{position:relative;width:36px;height:20px;background:#d7dce5;border-radius:10px;cursor:pointer;transition:.15s;flex:none}
.tgl.on{background:var(--green)}
.tgl i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:8px;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl.on i{left:18px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;justify-content:space-between;align-items:center}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding:6px 0 22px}
.bars .b{flex:1;background:#fbdadb;border-radius:5px 5px 0 0;min-height:4px;position:relative}
.bars .b.hi{background:var(--red)}
.bars .b span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--tx2)}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:#fff;border:1px solid var(--line);color:#3d4555;border-radius:9px;padding:7px 15px;font-size:12.5px;cursor:pointer}
.tabs button.on{color:var(--red);border-color:var(--red);background:var(--red-soft);font-weight:600}
.note{background:var(--blue-soft);border:1px solid #cfdefb;border-radius:10px;padding:11px 14px;font-size:12.5px;color:#1e4fc2;margin-bottom:16px}
.empty{color:var(--tx2);font-size:13px;padding:34px;text-align:center}
#login{position:fixed;inset:0;background:linear-gradient(160deg,#fff 0%,#f6f7f9 50%,#fdeeee 100%);display:flex;align-items:center;justify-content:center;z-index:50}
#login .box{width:390px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 12px 40px rgba(20,30,60,.08)}
#login input,#login select{width:100%;background:#fff;border:1px solid #d7dce5;border-radius:9px;padding:10px 13px;color:var(--tx);margin:6px 0 13px;font-size:13.5px}
label{font-size:12px;color:var(--tx2);font-weight:600}
.proto{position:fixed;bottom:10px;right:14px;font-size:10px;color:#b9c0cf;z-index:60}
/* CHAT */
.chat{display:flex;height:calc(100vh - 132px);background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.chat .col1{width:290px;min-width:290px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.chat .col1 .hd{padding:13px 14px;border-bottom:1px solid var(--line)}
.chat .col1 .filters{display:flex;gap:5px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{font-size:11px;padding:4px 10px;border-radius:11px;background:#f4f6f9;color:var(--tx2);cursor:pointer;border:1px solid transparent}
.chip.on{background:var(--red-soft);color:var(--red);border-color:#f3c1c3;font-weight:600}
.conv{display:flex;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid #f0f2f6}
.conv:hover{background:#fafbfd}.conv.on{background:var(--red-soft)}
.conv .cav{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;flex:none}
.conv .nm{font-size:13px;font-weight:600}.conv .pv{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:165px}
.conv .mt{margin-left:auto;text-align:right;font-size:10.5px;color:var(--tx2)}
.unread{display:inline-block;background:var(--red);color:#fff;font-size:10px;border-radius:9px;padding:1px 6px;font-weight:700}
.chat .col2{flex:1;display:flex;flex-direction:column;background:#f8f9fb;min-width:0}
.chat .col2 .hd{display:flex;align-items:center;gap:10px;padding:11px 16px;background:#fff;border-bottom:1px solid var(--line)}
.thread{flex:1;overflow-y:auto;padding:18px}
.msg{max-width:62%;margin-bottom:10px;padding:9px 13px;border-radius:12px;font-size:13.5px;background:#fff;border:1px solid var(--line);width:fit-content}
.msg.me{margin-left:auto;background:var(--red-soft);border-color:#f3d4d5}
.msg .who{font-size:10.5px;color:var(--tx2);margin-bottom:3px;font-weight:600}
.msg .qt{border-left:3px solid var(--red);background:#f8f9fb;padding:5px 9px;border-radius:6px;font-size:12px;color:var(--tx2);margin-bottom:6px}
.msg .audio{display:flex;align-items:center;gap:9px;min-width:190px}
.msg .audio .play{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px}
.msg .audio .wave{flex:1;height:18px;background:repeating-linear-gradient(90deg,#d7dce5 0 2px,transparent 2px 5px);border-radius:3px}
.msg .tm{font-size:10px;color:var(--tx2);text-align:right;margin-top:4px}
.suggest{background:#fff;border:1px dashed #d7a7e8;border-radius:11px;padding:10px 13px;margin:0 18px 10px;font-size:12.5px}
.composer{display:flex;align-items:center;gap:9px;background:#fff;border-top:1px solid var(--line);padding:11px 14px}
.composer input{flex:1;border:1px solid var(--line);border-radius:20px;padding:9px 15px;font-size:13.5px;outline:none}
.cbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;color:var(--tx2);flex:none}
.cbtn.mic{background:var(--red);color:#fff;border:none}
.chat .col3{width:270px;min-width:270px;border-left:1px solid var(--line);overflow-y:auto;padding:15px}
.chat .col3 h4{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.7px;margin:14px 0 8px}
.chat .col3 h4:first-child{margin-top:0}
.kv{font-size:12.5px;padding:4px 0;display:flex;justify-content:space-between}.kv span:first-child{color:var(--tx2)}
.task{font-size:12.5px;background:#f8f9fb;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:6px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#d7dce5;border-radius:5px}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <div class="row" style="gap:12px;margin-bottom:20px"><div style="width:42px;height:42px;border-radius:11px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:21px">🚀</div><div><b style="font-size:16px">CONSULT DELIVERY</b><div style="color:var(--tx2);font-size:10.5px;letter-spacing:1.5px">CONSULTORIA PARA DELIVERY · CONSOLE v2</div></div></div>
    <label>E-mail</label>
    <input value="wandson@consultdelivery.com.br">
    <label>Senha</label>
    <input type="password" value="••••••••••">
    <label>Operar como (tenant)</label>
    <select id="loginTenant"></select>
    <button class="btn" style="width:100%;justify-content:center;margin-top:4px" onclick="doLogin()">Entrar no console</button>
    <div style="text-align:center;margin-top:13px;font-size:11px;color:var(--tx2)">Login + seleção de tenant · cada cliente vê só o que é dele</div>
  </div>
</div>
<div id="app" style="display:none">
  <nav id="sb"></nav>
  <div id="main">
    <div id="tb">
      <span class="crumb">Plataforma › <b id="crumb">Visão Geral</b></span>
      <input class="search" placeholder="🔍  Buscar clientes, lojas, agentes, pedidos…">
      <span class="pill">Créditos IA <b>6,5k</b></span>
      <select id="tenantSel" onchange="setTenant(this.value)"></select>
      <span class="pill">🔔 <b>3</b></span>
      <div class="avatar">WS</div>
    </div>
    <div id="ct"></div>
  </div>
</div>
<div class="proto">PROTÓTIPO v2 clean · dados fictícios</div>
<script>
const TENANTS=[
 {id:'consult',nome:'Consult Delivery',plano:'Interno',lojas:['Uraka Burger','Salgados da Mônica','Pizza Forte','Açaí do Vale'],agentes:'todos'},
 {id:'uraka',nome:'Uraka Burger (cliente)',plano:'Performance',lojas:['Uraka — Centro','Uraka — Cidade Nova'],agentes:['deli','breno','cora','analise-ifood','bom-dia','encerramento']},
 {id:'monica',nome:'Salgados da Mônica (cliente)',plano:'Light',lojas:['Salgados da Mônica'],agentes:['breno','analise-ifood','bom-dia']}
];
const AGENTS=[
 {id:'deli',n:'DELI',d:'COO digital — orquestração e monitoramento',cor:'#d92329',runs:42,t:'~1 min'},
 {id:'lara',n:'LARA',d:'CRM food service + régua de disparo',cor:'#a855f7',runs:12,t:'~45s'},
 {id:'vera',n:'VERA',d:'BI e relatórios semanais',cor:'#0d9488',runs:8,t:'~1 min'},
 {id:'breno',n:'BRENO',d:'Atendimento e suporte ao cliente',cor:'#2563eb',runs:36,t:'~20s'},
 {id:'cora',n:'CORA',d:'Cobrança inteligente e régua de inadimplência',cor:'#16a34a',runs:9,t:'~30s'},
 {id:'sofia',n:'SOFIA',d:'SDR / prospecção de novos clientes',cor:'#9333ea',runs:4,t:'~2 min'},
 {id:'max',n:'MAX',d:'Consultor técnico e auditoria de cardápio',cor:'#d97706',runs:2,t:'~2 min'},
 {id:'nova',n:'NOVA',d:'Desenho de automações IA para clientes',cor:'#475569',runs:1,t:'~1 min'},
 {id:'analise-ifood',n:'Análise iFood',d:'Análise completa de loja iFood',cor:'#e11d48',runs:31,t:'~4 min'},
 {id:'bom-dia',n:'Bom Dia',d:'Imagens e mensagens de abertura',cor:'#ca8a04',runs:214,t:'~15s'},
 {id:'encerramento',n:'Encerramento',d:'Fechamento de expediente',cor:'#64748b',runs:198,t:'~15s'},
 {id:'loja-gpt',n:'Loja-GPT',d:'Chat com contexto da loja',cor:'#0891b2',runs:16,t:'~40s'}
];
const APROV=[
 {id:1,ag:'CORA',tipo:'Mensagem de cobrança',alvo:'Uraka Burger — fatura R$ 890 (12d atraso)',origem:'régua D+12',risco:'amarelo',txt:'Oi, tudo bem? Notamos que a fatura de março segue em aberto…'},
 {id:2,ag:'MIA',tipo:'Sugestão de resposta',alvo:'Conversa WhatsApp — Salgados da Mônica',origem:'monitor 15min',risco:'verde',txt:'Cliente perguntou sobre prazo de entrega da campanha…'},
 {id:3,ag:'LARA',tipo:'Post de oferta',alvo:'Campanha junho — Açaí do Vale',origem:'calendário editorial',risco:'verde',txt:'🌟 Oferta da semana: açaí 500ml com 20% off…'},
 {id:4,ag:'BRENO',tipo:'Resposta off-hours',alvo:'Pizza Forte — cliente final',origem:'webhook 23:40',risco:'verde',txt:'Nosso horário de atendimento é das 18h às 23h…'},
 {id:5,ag:'CORA',tipo:'Escalonamento',alvo:'Salgados da Mônica — fatura R$ 450 (31d)',origem:'régua D+30',risco:'vermelho',txt:'Sugestão: pausar serviços e acionar contato direto…'}
];
const SKILLS=[['create-agent','Cria agente novo guiado','global'],['analise-cardapio','Audita cardápio iFood','global'],['regua-cobranca','Régua de inadimplência D+3/7/12/30','global'],['post-oferta','Gera post de oferta (nunca “promoção”)','global'],['resumo-semanal','Resumo BI da semana','global'],['boas-vindas-uraka','Onboarding custom Uraka','tenant']];
const ROTINAS=[['bom-dia','Diária 06:00','hoje 06:00 · ok',true],['encerramento','Diária 23:30','ontem 23:30 · ok',true],['mia-batch','A cada 15 min','há 4 min · ok',true],['vera-semanal','Seg 08:00','seg · ok',true],['cora-regua','Diária 09:00','hoje · 2 aprovações geradas',true],['backup-kb','Dom 03:00','dom · ok',false]];
const RUNS=[['deli-conversa','DELI','consult','ok','$0.04','38s','há 12 min'],['breno-responder','BRENO','uraka','ok','$0.01','9s','há 26 min'],['mia-batch','MIA','consult','ok','$0.02','71s','há 4 min'],['analise-ifood-run','Análise iFood','monica','ok','$0.31','3m52s','há 2 h'],['cora-analisar','CORA','uraka','ok','$0.03','24s','há 3 h'],['vera-snapshot','VERA','consult','falha','$0.00','2s','há 5 h'],['bom-dia','Bom Dia','consult','ok','$0.01','12s','hoje 06:00']];
const CUSTOS=[['Seg',2.1],['Ter',3.4],['Qua',2.8],['Qui',4.9],['Sex',3.2],['Sáb',1.4],['Dom',1.1]];
const CONVS=[
 {id:0,nm:'Grupo Uraka — Operação',cor:'#d97706',loja:'Uraka — Centro',dep:'Suporte',un:2,st:'em atendimento',msgs:[
  {who:'João (Uraka)',t:'Bom dia! O cardápio novo já subiu no iFood?',tm:'09:12'},
  {who:'BRENO · agente',me:1,t:'Bom dia, João! Subiu sim — 36 itens ativos, 2 pausados por falta de foto. Quer que eu liste os pausados?',tm:'09:12'},
  {who:'João (Uraka)',t:'Quero sim, por favor',tm:'09:14'},
  {who:'João (Uraka)',audio:1,tm:'09:15'},
  {who:'Wandson · você',me:1,qt:'áudio · 0:42 — João (Uraka)',t:'Ouvi aqui, João. O combo casal sem foto eu resolvo hoje com o MAX. 👍',tm:'09:21'}]},
 {id:1,nm:'Cliente final — Pizza Forte',cor:'#2563eb',loja:'Pizza Forte',dep:'Vendas',un:0,st:'bot ativo',msgs:[
  {who:'Cliente',t:'Vocês abrem hoje?',tm:'23:40'},
  {who:'Bot fora-de-horário',me:1,t:'Nosso horário é das 18h às 23h. Posso anotar seu pedido pra amanhã? 🍕',tm:'23:40'}]},
 {id:2,nm:'Mônica — Salgados',cor:'#0d9488',loja:'Salgados da Mônica',dep:'Financeiro',un:1,st:'aguardando',msgs:[
  {who:'Mônica',t:'Wandson, consegue me mandar a 2ª via da fatura?',tm:'14:02'}]}
];
let enab={};TENANTS.forEach(t=>{enab[t.id]={};AGENTS.forEach(a=>{enab[t.id][a.id]=(t.agentes==='todos')||t.agentes.includes(a.id)})});
let TEN='consult',aprovados=[],rejeitados=[],convSel=0,deptFiltro='Todos';
const $=id=>document.getElementById(id);
const ten=()=>TENANTS.find(t=>t.id===TEN);
const kpi=(l,v,d,neg,mut)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d ${neg?'neg':''} ${mut?'mut':''}">${d||'&nbsp;'}</div></div>`;
const tbl=(cols,rows)=>`<table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
const bOK='<span class="bdg b-ok">ativo</span>';
function generic(t,desc,kpis,cols,rows,acao){return `<h1>${t}</h1><div class="sub">${desc}</div>${kpis?`<div class="kpis">${kpis}</div>`:''}<div class="card"><div class="spread" style="margin-bottom:12px"><h3 style="margin:0">${t}</h3><div class="row">${acao?`<button class="btn sec sm">⤓ Exportar</button><button class="btn sm">${acao}</button>`:''}</div></div>${tbl(cols,rows)}</div>`}
